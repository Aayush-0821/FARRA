services:
  postgres:
    image: postgres:17
    container_name: farra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farra
    ports:
      - "5432:5432"
    volumes:
      - farra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: farra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - farra-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farra-postgres-data:
  farra-redis-data: